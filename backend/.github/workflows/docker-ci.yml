# /backend/.github/workflows/docker-ci.yml
name: Docker Build CI Test

# 메인 브랜치로 PR이 올라오거나, push될 때 자동으로 실행
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소의 코드를 내려받음
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 25 설치 및 Gradle 빌드 (jar 파일 생성)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      # 3. Dockerfile을 이용해 실제 Docker 이미지 빌드 검증
      - name: Build Docker Image
        run: |
          docker build -t merge-backend-test .